name: ADK First Batch Materialize

on:
  push:
    branches: ['import/adk-daily-core-7.0.31']
    paths: ['.github/workflows/adk-first-batch-materialize.yml']

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'jiying2007/codex' && github.ref == 'refs/heads/import/adk-daily-core-7.0.31'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: jiying2007/agent-dev-kit
          ref: 7367ef84787de75bb751940b32c9e80009660e47
          path: .adk-upgrade-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Import only the three reviewed exact source trees
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          from tools.codex_assets.adk_skill_audit import _provider, _candidate, _tree, _digest
          root = Path.cwd()
          base = '159e023bd1be6f21113f1f9c166d570389b64694'
          sha = '7367ef84787de75bb751940b32c9e80009660e47'
          initial_changes = subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert initial_changes == ['.github/workflows/adk-first-batch-materialize.yml']
          provider_root = root / '.adk-upgrade-source'
          provider = _provider(provider_root, sha)
          assert provider['version'] == '7.0.31'
          reviewed = {
              'adk-code-review-loop': ('4f5dbeda455a1918de62aed70161e4107355f8325880a344306ecc5dbfe1b08d','a9ae8c66af6b8bd1ad250d3dc208fe3082492feb682b028243d2ebf15818364a'),
              'adk-runtime-router': ('368bbb2311f627a4409d98b554037b369c0091def703fa4dda4a20e205e65dc2','460073fcac9ec92763c20d32fde305862e2d6692d557c4d95900ca556d018cd3'),
              'adk-verification-before-completion': ('63ec4c5bc806eb5fa7e808cf47b1c4c44520b1b180c1b4262a64b71a86f520c5','9b8a3333309f2af29ac52af82cedf81a64f33ed50c8dac119b08dba94eca87ab'),
          }
          manifest_path = root / 'manifests/skills.json'
          original_text = manifest_path.read_text(encoding='utf-8')
          manifest = json.loads(original_text)
          assert json.dumps(manifest,ensure_ascii=False,indent=2)+'\n' == original_text
          records = {item['name']: item for item in manifest['skills']}
          stage = ['manifests/skills.json','src/codex-home/skills/registry.csv']
          report = {'base_commit':base,'provider_commit':sha,'source_release':'v7.0.31','skills':[],'live_installation_verified':False}
          for name, (old_digest, new_digest) in reviewed.items():
              item = records[name]
              old_dir = root / 'src/codex-home' / item['vendor_rel']
              assert _digest(_tree(old_dir)) == old_digest, name
              source_ref = f'skills/{name}/SKILL.md'
              source_tree = _candidate(provider_root,source_ref,provider)
              assert _digest(source_tree) == new_digest, name
              source_dir = provider_root / 'skills' / name
              version = re.search(r'^version: ([0-9]+\.[0-9]+\.[0-9]+)$',(source_dir/'SKILL.md').read_text(encoding='utf-8'),re.M).group(1)
              new_rel = f'vendor/skills/{name}/{version}'
              new_dir = root / 'src/codex-home' / new_rel
              assert old_dir == new_dir or not new_dir.exists(), name
              if old_dir != new_dir:
                  shutil.copytree(old_dir,new_dir)
              assert not (set(_tree(old_dir)) - set(source_tree)), name
              for relative in source_tree:
                  destination = new_dir / relative
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(source_dir / relative,destination)
              assert _tree(new_dir) == source_tree, name
              old_rel = old_dir.relative_to(root).as_posix()
              stage.extend([old_rel,new_dir.relative_to(root).as_posix()])
              if old_dir != new_dir:
                  shutil.rmtree(old_dir)
              previous = {key:item.get(key) for key in ('version','source_repo','source_ref','vendor_rel')}
              item.update(version=version,vendor_rel=new_rel,source_repo='jiying2007/agent-dev-kit',source_ref=sha,source_path=source_ref,source_blob=source_tree['SKILL.md']['blob'],source_tree_sha256=new_digest,source_release='v7.0.31',imported_at='2026-09-24')
              report['skills'].append({'name':name,'previous':previous,'version':version,'file_count':len(source_tree),'source_blob':item['source_blob'],'source_tree_sha256':new_digest})
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          registry_path = root / 'src/codex-home/skills/registry.csv'
          lines = registry_path.read_text(encoding='utf-8').splitlines(keepends=True)
          for index,line in enumerate(lines):
              fields = line.rstrip('\n').split(',')
              if fields[0] in reviewed:
                  fields[1] = records[fields[0]]['version']
                  lines[index] = ','.join(fields)+'\n'
          registry_path.write_text(''.join(lines),encoding='utf-8')
          subprocess.run(['git','add','--',*dict.fromkeys(stage)],check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only','--no-renames'],text=True).splitlines()
          assert all(path in stage[:2] or any(path.startswith(f'src/codex-home/vendor/skills/{name}/') for name in reviewed) for path in changed)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          out = Path(os.environ['RUNNER_TEMP'])/'adk-first-batch'
          out.mkdir()
          (out/'import.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          subprocess.run(['git','archive','--format=tar',tree,'-o',str(out/'candidate.tar')],check=True)
          subprocess.run(['git','archive','--format=tar',base,'-o',str(out/'baseline.tar')],check=True)
          subprocess.run(['git','-C',str(provider_root),'archive','--format=tar',sha,'-o',str(out/'provider.tar'),'manifest.json','skills/adk-code-review-loop','skills/adk-runtime-router','skills/adk-verification-before-completion'],check=True)
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Run existing source and behavior regressions before creating the import commit
        env:
          CODEX_OFFLINE_HERMETIC: '1'
        run: |
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
          python -m unittest tests.test_adk_skill_audit tests.test_agent_rules tests.test_session_bootstrap tests.test_session_bootstrap_independence tests.test_execution_policy tests.test_execution_policy_source_set tests.test_skill_catalog tests.test_profile_documentation tests.test_activity_reporting_skills tests.test_retired_profile
      - name: Commit only the selected source import on this branch
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(skills): 导入三个日常核心 Skill 的 ADK 7.0.31 精确源码'
          git push origin HEAD:refs/heads/import/adk-daily-core-7.0.31
          git rev-parse HEAD > "$RUNNER_TEMP/adk-first-batch/consumer-commit.txt"
          git diff --binary 159e023bd1be6f21113f1f9c166d570389b64694 HEAD -- manifests/skills.json src/codex-home/vendor/skills src/codex-home/skills/registry.csv > "$RUNNER_TEMP/adk-first-batch/import.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adk-first-batch-materialized
          path: ${{ runner.temp }}/adk-first-batch/*
          retention-days: 7
          if-no-files-found: error
