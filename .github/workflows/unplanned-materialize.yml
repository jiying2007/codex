name: Unplanned Asset Fix Materialize
on:
  push:
    branches: [fix/unplanned-live-assets]
    paths: ['.github/workflows/unplanned-materialize.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Materialize only the reviewed patch
        run: |
          test "$(git rev-parse HEAD:tools/codex_assets/core.py)" = 7d99e002f290f49e75067f2c535e1c62543f181e
          echo 'a9ef4b19819bea885548a2aafb0f15ca440eb5936b9cefdfea772bdf767fac78  .github/unplanned-preflight.patch' | sha256sum --check --strict
          git apply --check .github/unplanned-preflight.patch
          git apply .github/unplanned-preflight.patch
          test "$(git hash-object tools/codex_assets/core.py)" = ff1c53cf6d7e4c303b47cd5d575aa003fe4768de
          test "$(git hash-object tests/test_unplanned_live_assets.py)" = f8066c965c64676a8ad902db3c1963a9f526343a
          test "$(git hash-object docs/member-rollout.md)" = 7ce7c57424111f6b6329be94de2adcb8d8e21841
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
          python -m unittest tests.test_unplanned_live_assets tests.test_member_install_paths tests.test_apply_prune tests.test_apply_backup_integrity
          git diff --check
      - name: Remove temporary files and commit the fix
        run: |
          git rm -- .github/unplanned-preflight.patch .github/workflows/unplanned-materialize.yml
          git add -- tools/codex_assets/core.py tests/test_unplanned_live_assets.py docs/member-rollout.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(install): 在写入前阻断未纳入计划的历史资产'
          git push origin HEAD:refs/heads/fix/unplanned-live-assets
