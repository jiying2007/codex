name: Member Install Materialize
on:
  push:
    branches: [fix/member-install-paths]
    paths: ['.github/workflows/member-install-materialize.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply the exact reviewed patch and verify resulting blobs
        env:
          CODEX_OFFLINE_HERMETIC: '1'
        run: |
          test "$(git rev-parse HEAD^)" = d5720c18ea9b1d4267da2285ffc559c559b74ecd
          echo '62abd3e38d7d25c3fd6dccc49c544624d06ae03d324f730bc85c2717199132b5  .github/member-core.patch' | sha256sum --check --strict
          git apply --check .github/member-core.patch
          git apply .github/member-core.patch
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
          python - <<'PY'
          import subprocess
          expected = {
              'README.md': '29b95db55e9355c8ba603bbc81a2b5a0996a43ca',
              'docs/member-rollout.md': '799a136b4c64417bb82fb2f75f0529b677ab8d27',
              'tests/test_member_install_paths.py': '9d377146cf3cdf7d8f57c0484ca47535aad722a0',
              'tools/codex_assets/core.py': '7d99e002f290f49e75067f2c535e1c62543f181e',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != blob:
                  raise SystemExit(f'reviewed blob mismatch: {path}')
          print('All four reviewed blobs match')
          PY
          mkdir -p "$RUNNER_TEMP/member-install-evidence"
          python -m unittest tests.test_member_install_paths tests.test_apply_prune tests.test_apply_backup_integrity tests.test_doctor_execution_policy tests.test_adk_daily_core_import tests.test_adk_skill_distribution tests.test_governance tests.test_governance_summary > "$RUNNER_TEMP/member-install-evidence/focused.log" 2>&1
          python -m tools.codex_assets doctor --scope repo
          python -m tools.codex_assets doctor --scope governance
          git diff --check
      - name: Remove temporary materialization and commit only reviewed files
        run: |
          git rm -- .github/member-core.patch .github/workflows/member-install-materialize.yml
          git add -- README.md docs/member-rollout.md tests/test_member_install_paths.py tools/codex_assets/core.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(install): 保护成员链接文件并明确现场安装验收'
          git push origin HEAD:refs/heads/fix/member-install-paths
          git rev-parse HEAD > "$RUNNER_TEMP/member-install-evidence/commit.txt"
          git archive HEAD > "$RUNNER_TEMP/member-install-evidence/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: member-install-materialized
          path: ${{ runner.temp }}/member-install-evidence/
          retention-days: 7
