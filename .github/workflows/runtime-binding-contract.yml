name: Runtime Binding Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'manifests/**'
      - 'src/codex-home/**'
      - 'tools/codex_assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'vendor/wheels/**'
      - 'docs/execution-policy.md'
      - 'docs/session-bootstrap.md'
      - 'docs/small-team-delivery.md'
      - 'docs/adk-source-upgrade.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/runtime-binding-contract.yml'
  push:
    branches: [main]
    paths:
      - 'manifests/**'
      - 'src/codex-home/**'
      - 'tools/codex_assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'vendor/wheels/**'
      - 'docs/execution-policy.md'
      - 'docs/session-bootstrap.md'
      - 'docs/small-team-delivery.md'
      - 'docs/adk-source-upgrade.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/runtime-binding-contract.yml'
  workflow_dispatch:
    inputs:
      audit_adk_candidate:
        description: Compare Skills against the exact pinned ADK 7.0.31 source (read-only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unsupported-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Reject real Python 3.10 before dependencies or target writes
        run: python -B -S -m unittest discover -s tests -p 'test_python_runtime.py' -v
  contract:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enforce SHA-pinned workflow actions
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('.github/workflows/runtime-binding-contract.yml')
          failures = []
          for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.search(r'\buses:\s*[^\s@]+@([^\s#]+)', line)
              if match and not re.fullmatch(r'[0-9a-f]{40}', match.group(1)):
                  failures.append(f'{path}:{lineno}: {match.group(1)}')
          if failures:
              raise SystemExit('GitHub actions must be pinned by full commit SHA:\n' + '\n'.join(failures))
          PY
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Validate supported interpreter preflight
        run: python -m unittest tests.test_python_runtime
      - name: Validate full repository doctor and disposable lifecycle
        env:
          CODEX_OFFLINE_HERMETIC: '1'
        run: |
          python -m tools.codex_assets doctor --scope repo
          python -m tools.codex_assets doctor --scope governance
          python -m unittest tests.test_governance tests.test_governance_summary tests.test_check_script tests.test_doctor_execution_policy tests.test_operator_execution_policy tests.test_agent_routing_eval
      - name: Validate runtime binding contracts
        run: python scripts/validate-runtime-binding.py
      - name: Validate exact ADK agent binding
        run: python scripts/validate-adk-agent-binding.py
      - name: Validate installed AGENTS rules and negative regressions
        run: |
          python scripts/validate-agent-rules.py
          python -m unittest tests.test_agent_rules
      - name: Validate canonical Execution Policy CLI from external cwd
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m tools.codex_assets execution-policy --root "$GITHUB_WORKSPACE" --thread-id ci-command-contract gate --help
      - name: Validate Codex Execution Policy adapter
        run: python -m unittest tests.test_execution_policy
      - name: Validate exact ADK 7.0.31 Execution Policy source set and replay
        run: python -m unittest tests.test_execution_policy_source_set tests.test_execution_policy_migration
      - name: Validate thin Session Bootstrap and daily independence
        run: python -m unittest tests.test_session_bootstrap tests.test_session_bootstrap_independence tests.test_session_bootstrap_contract
      - name: Validate Skill source and distribution identities
        run: python -m unittest tests.test_adk_skill_audit tests.test_adk_daily_core_import tests.test_adk_skill_distribution tests.test_apply_prune tests.test_apply_backup_integrity
      - name: Collect current Skill provenance gaps (not upgrade certification)
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from tools.codex_assets.adk_skill_audit import audit, summary
          report = audit(Path.cwd())
          report['consumer_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          directory = Path(os.environ['RUNNER_TEMP']) / 'adk-skill-audit'
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'current.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary(report), ensure_ascii=False, sort_keys=True))
          if report['status'] != 'consistent':
              raise SystemExit('Active ADK Skill source/distribution identity drift; import is not accepted.')
          print('Skill source/distribution identity consistent; not runtime or member qualification.')
          PY
      - name: Checkout exact candidate only for explicit maintenance audit
        if: >-
          matrix.python-version == '3.11' &&
          ((github.event_name == 'workflow_dispatch' && inputs.audit_adk_candidate) ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'adk-candidate-audit')))
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: jiying2007/agent-dev-kit
          ref: 7367ef84787de75bb751940b32c9e80009660e47
          path: .adk-upgrade-source
          persist-credentials: false
      - name: Compare exact candidate Skill trees without installing
        if: >-
          matrix.python-version == '3.11' &&
          ((github.event_name == 'workflow_dispatch' && inputs.audit_adk_candidate) ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'adk-candidate-audit')))
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from tools.codex_assets.adk_skill_audit import audit, summary
          report = audit(Path.cwd(), Path('.adk-upgrade-source'), '7367ef84787de75bb751940b32c9e80009660e47')
          report['consumer_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          directory = Path(os.environ['RUNNER_TEMP']) / 'adk-skill-audit'
          (directory / 'candidate.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary(report), ensure_ascii=False, sort_keys=True))
          for item in report['skills']:
              target = item['target'] or {}
              print(json.dumps({'name': item['name'], 'target_status': target.get('status', 'blocked'), 'reason': target.get('reason'), 'added': len(target.get('added', [])), 'removed': len(target.get('removed', [])), 'changed': len(target.get('changed', []))}, sort_keys=True))
          print('Exact source comparison only; semantic acceptance, release/import/apply and live validation are not performed.')
          PY
      - name: Retain bounded source audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adk-skill-audit-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/adk-skill-audit/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate JSON syntax
        run: |
          python -m json.tool manifests/integrations/digital-worker-runtime-binding.json >/dev/null
          python -m json.tool manifests/provider-locks/agent-dev-kit.json >/dev/null
          python -m json.tool manifests/provider-locks/knowledge-hub.json >/dev/null
          python -m json.tool manifests/agents.json >/dev/null
          python -m json.tool manifests/execution_policy.json >/dev/null
          python -m json.tool manifests/session_bootstrap.json >/dev/null
          python -m json.tool schemas/runtime-execution-receipt.schema.json >/dev/null
          python -m json.tool schemas/runtime-execution-receipt.v2.schema.json >/dev/null
      - name: Validate provider/bootstrap adapter shell
        run: |
          bash -n scripts/knowledge-provider.sh
          bash -n scripts/session-bootstrap.sh
      - name: Prove missing provider fails closed
        run: |
          set +e
          HOME="$RUNNER_TEMP/no-provider-home" bash scripts/knowledge-provider.sh status >"$RUNNER_TEMP/provider-status.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"status":"BLOCKED"' "$RUNNER_TEMP/provider-status.json"
      - name: Ensure CI never applies to a real Codex home
        run: test ! -e "$HOME/.codex/control/state/active-profile.env"
