name: Runtime Binding Contract

on:
  pull_request:
    paths:
      - 'manifests/integrations/**'
      - 'manifests/provider-locks/**'
      - 'manifests/agents.json'
      - 'manifests/assets.json'
      - 'manifests/profiles.json'
      - 'manifests/execution_policy.json'
      - 'manifests/session_bootstrap.json'
      - 'src/codex-home/vendor/agents/**'
      - 'src/codex-home/AGENTS.md'
      - 'tools/codex_assets/validate.py'
      - 'tools/codex_assets/execution_policy_adapter.py'
      - 'tools/codex_assets/execution_policy/**'
      - 'tools/codex_assets/model.py'
      - 'tools/codex_assets/privacy_ref.py'
      - 'tools/codex_assets/session_bootstrap.py'
      - 'tests/test_execution_policy.py'
      - 'tests/test_execution_policy_source_set.py'
      - 'tests/test_session_bootstrap.py'
      - 'tests/test_session_bootstrap_independence.py'
      - 'tests/test_agent_rules.py'
      - 'vendor/wheels/**'
      - 'docs/execution-policy.md'
      - 'docs/session-bootstrap.md'
      - 'docs/small-team-delivery.md'
      - 'scripts/validate-adk-agent-binding.py'
      - 'scripts/validate-agent-rules.py'
      - 'schemas/runtime-execution-receipt.schema.json'
      - 'schemas/runtime-execution-receipt.v2.schema.json'
      - 'scripts/knowledge-provider.sh'
      - 'scripts/session-bootstrap.sh'
      - 'scripts/validate-runtime-binding.py'
      - 'AGENTS.md'
      - '.github/workflows/runtime-binding-contract.yml'
  push:
    branches: [main]
    paths:
      - 'manifests/integrations/**'
      - 'manifests/provider-locks/**'
      - 'manifests/agents.json'
      - 'manifests/assets.json'
      - 'manifests/profiles.json'
      - 'manifests/execution_policy.json'
      - 'manifests/session_bootstrap.json'
      - 'src/codex-home/vendor/agents/**'
      - 'src/codex-home/AGENTS.md'
      - 'tools/codex_assets/validate.py'
      - 'tools/codex_assets/execution_policy_adapter.py'
      - 'tools/codex_assets/execution_policy/**'
      - 'tools/codex_assets/model.py'
      - 'tools/codex_assets/privacy_ref.py'
      - 'tools/codex_assets/session_bootstrap.py'
      - 'tests/test_execution_policy.py'
      - 'tests/test_execution_policy_source_set.py'
      - 'tests/test_session_bootstrap.py'
      - 'tests/test_session_bootstrap_independence.py'
      - 'tests/test_agent_rules.py'
      - 'vendor/wheels/**'
      - 'docs/execution-policy.md'
      - 'docs/session-bootstrap.md'
      - 'docs/small-team-delivery.md'
      - 'scripts/validate-adk-agent-binding.py'
      - 'scripts/validate-agent-rules.py'
      - 'schemas/runtime-execution-receipt.schema.json'
      - 'schemas/runtime-execution-receipt.v2.schema.json'
      - 'scripts/knowledge-provider.sh'
      - 'scripts/session-bootstrap.sh'
      - 'scripts/validate-runtime-binding.py'
      - 'AGENTS.md'
      - '.github/workflows/runtime-binding-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enforce SHA-pinned workflow actions
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('.github/workflows/runtime-binding-contract.yml')
          failures = []
          for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.search(r'\buses:\s*[^\s@]+@([^\s#]+)', line)
              if match and not re.fullmatch(r'[0-9a-f]{40}', match.group(1)):
                  failures.append(f'{path}:{lineno}: {match.group(1)}')
          if failures:
              raise SystemExit('GitHub actions must be pinned by full commit SHA:\n' + '\n'.join(failures))
          PY
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Validate runtime binding contracts
        run: python scripts/validate-runtime-binding.py
      - name: Validate exact ADK agent binding
        run: python scripts/validate-adk-agent-binding.py
      - name: Validate installed AGENTS rules and negative regressions
        run: |
          python scripts/validate-agent-rules.py
          python -m unittest tests.test_agent_rules
      - name: Validate canonical Execution Policy CLI from external cwd
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m tools.codex_assets execution-policy --root "$GITHUB_WORKSPACE" --thread-id ci-command-contract gate --help
      - name: Validate Codex Execution Policy adapter
        run: python -m unittest tests.test_execution_policy
      - name: Validate exact ADK 7.0.4 Execution Policy source set
        run: python -m unittest tests.test_execution_policy_source_set
      - name: Validate thin Session Bootstrap and daily independence
        run: python -m unittest tests.test_session_bootstrap tests.test_session_bootstrap_independence
      - name: Validate JSON syntax
        run: |
          python -m json.tool manifests/integrations/digital-worker-runtime-binding.json >/dev/null
          python -m json.tool manifests/provider-locks/agent-dev-kit.json >/dev/null
          python -m json.tool manifests/provider-locks/knowledge-hub.json >/dev/null
          python -m json.tool manifests/agents.json >/dev/null
          python -m json.tool manifests/execution_policy.json >/dev/null
          python -m json.tool manifests/session_bootstrap.json >/dev/null
          python -m json.tool schemas/runtime-execution-receipt.schema.json >/dev/null
          python -m json.tool schemas/runtime-execution-receipt.v2.schema.json >/dev/null
      - name: Validate provider/bootstrap adapter shell
        run: |
          bash -n scripts/knowledge-provider.sh
          bash -n scripts/session-bootstrap.sh
      - name: Prove missing provider fails closed
        run: |
          set +e
          HOME="$RUNNER_TEMP/no-provider-home" bash scripts/knowledge-provider.sh status >"$RUNNER_TEMP/provider-status.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"status":"BLOCKED"' "$RUNNER_TEMP/provider-status.json"
      - name: Ensure CI never applies to a real Codex home
        run: test ! -e "$HOME/.codex/control/state/active-profile.env"
