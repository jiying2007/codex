name: Runtime R2 Execution Contract

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-r2-provider-execution.yml'
      - '.github/workflows/runtime-r2-execution-contract.yml'
      - 'scripts/runtime-r2-local.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-r2-provider-execution.yml'
      - '.github/workflows/runtime-r2-execution-contract.yml'
      - 'scripts/runtime-r2-local.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Validate runtime-owned local R2 execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/runtime-r2-provider-execution.yml
          bash -n scripts/runtime-r2-local.sh
          PYTHON_BIN=python3 bash scripts/runtime-r2-local.sh --help >/dev/null
          python - <<'PY'
          import pathlib, re, yaml
          workflow=pathlib.Path('.github/workflows/runtime-r2-execution-contract.yml')
          text=workflow.read_text(encoding='utf-8')
          yaml.load(text, Loader=yaml.BaseLoader)
          bad=[]
          for lineno,line in enumerate(text.splitlines(),1):
              m=re.search(r'\buses:\s*[^\s@]+@([^\s#]+)',line)
              if m and not re.fullmatch(r'[0-9a-f]{40}',m.group(1)):
                  bad.append(f'{workflow}:{lineno}:{m.group(1)}')
          assert not bad, 'unpinned actions: '+', '.join(bad)

          local=pathlib.Path('scripts/runtime-r2-local.sh').read_text(encoding='utf-8')
          assert 'PYTHON_BIN=${PYTHON_BIN:-python3}' in local
          assert 'if sys.version_info < (3, 11):' in local
          assert 'Python >= 3.11 required' in local
          assert 'for cmd in git python ' not in local
          assert 'CODEX_RUNTIME_CREDENTIAL' not in local
          assert 'CLAUDE_RUNTIME_CREDENTIAL' not in local
          assert 'codex exec' in local
          assert 'CODEX_HOME=' in local
          assert '"authorization_mode":"explicit-local-operator-execution"' in local
          assert '"runtime_host":"local-terminal"' in local
          assert '"github_provider_credential_used":False' in local
          assert '"verification_or_release_authority":False' in local
          assert '"verification_pass_claimed":False' in local
          assert '"r2_qualified":False' in local
          assert 'runtime_r2_evidence.py" project-receipt' in local
          assert 'result-tree.tar.gz' in local

          lines=local.splitlines()
          blocks=[]
          current=None
          for line in lines:
              if "<<'PY'" in line:
                  current=[]
                  continue
              if current is not None and line == 'PY':
                  blocks.append('\n'.join(current))
                  current=None
                  continue
              if current is not None:
                  current.append(line)
          assert current is None, 'unterminated Python heredoc'
          assert blocks, 'no embedded Python blocks found'
          for index, block in enumerate(blocks, 1):
              compile(block, f'embedded-python-{index}', 'exec')
          print('[PASS] Codex R2 execution is local-terminal owned, Python-3-only, and GitHub-provider-credential free')
          PY
