name: ADK Remaining Source Snapshot
on:
  push:
    branches: ['import/adk-remaining-skills-7.0.31']
    paths: ['.github/workflows/adk-remaining-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: jiying2007/agent-dev-kit
          ref: 7367ef84787de75bb751940b32c9e80009660e47
          persist-credentials: false
      - name: Preserve exact source and Git identities without executing provider code
        run: |
          test "$(git rev-parse HEAD)" = 7367ef84787de75bb751940b32c9e80009660e47
          mkdir -p "$RUNNER_TEMP/adk-source"
          git archive HEAD > "$RUNNER_TEMP/adk-source/provider.tar"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/adk-source/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/adk-source/commit.txt"
          sha256sum "$RUNNER_TEMP/adk-source/provider.tar" > "$RUNNER_TEMP/adk-source/provider.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adk-remaining-source
          path: ${{ runner.temp }}/adk-source/
          retention-days: 7
          if-no-files-found: error
