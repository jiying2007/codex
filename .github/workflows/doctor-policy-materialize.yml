name: Doctor Policy Repair Materialize
on:
  push:
    branches: ['fix/doctor-execution-policy']
    paths: ['.github/workflows/doctor-policy-materialize.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Migrate only declared operator references
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='d457cf95baa0be41a9914f99b112dbf3d4afbacf'
          names=['workflows.json','workflow_recipes.json','hook_contracts.json','cli_command_contracts.json','trace_eval_contracts.json','guidance_promotions.json']
          old='rtk bash scripts/runtime-control.sh'
          new='rtk python3 -m tools.codex_assets execution-policy'
          bound=new+' --thread-id "${CODEX_THREAD_ID:?current thread id required}"'
          def migrate(value):
              if isinstance(value,str):
                  return value.replace(old+' --help',new+' --help').replace(old,bound).replace('tests.test_runtime_control','tests.test_execution_policy').replace('runtime-control','execution-policy').replace('Runtime Control','Execution Policy')
              if isinstance(value,list):
                  return [migrate(item) for item in value]
              if isinstance(value,dict):
                  return {key:migrate(item) for key,item in value.items()}
              return value
          rows=[]
          for name in names:
              path=Path('manifests')/name
              before=path.read_bytes()
              value=json.loads(before)
              updated=migrate(value)
              # Migration changes strings only; enabled flags and all nonstring values remain unchanged.
              def nonstrings(value):
                  if isinstance(value,str): return '<text>'
                  if isinstance(value,list): return [nonstrings(v) for v in value]
                  if isinstance(value,dict): return {k:nonstrings(v) for k,v in value.items()}
                  return value
              assert nonstrings(value)==nonstrings(updated)
              after=(json.dumps(updated,ensure_ascii=False,indent=2)+'\n').encode()
              assert before!=after,name
              path.write_bytes(after)
              rows.append({'path':str(path),'before_sha256':hashlib.sha256(before).hexdigest(),'after_sha256':hashlib.sha256(after).hexdigest()})
          subprocess.run(['git','diff','--check'],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'doctor-repair'
          out.mkdir()
          (out/'operator-migration.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Verify current doctor, parser, routing and installation behavior
        env:
          CODEX_OFFLINE_HERMETIC: '1'
        run: |
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
          python -m tools.codex_assets doctor --scope repo
          python -m tools.codex_assets doctor --scope governance
          python -m unittest tests.test_operator_execution_policy tests.test_agent_routing_eval tests.test_doctor_execution_policy tests.test_governance tests.test_governance_summary tests.test_check_script tests.test_execution_policy tests.test_execution_policy_source_set tests.test_adk_daily_core_import tests.test_apply_backup_integrity 2>&1 | tee "$RUNNER_TEMP/doctor-repair/tests.log"
      - name: Commit only verified manifest changes
        run: |
          git add -- manifests/workflows.json manifests/workflow_recipes.json manifests/hook_contracts.json manifests/cli_command_contracts.json manifests/trace_eval_contracts.json manifests/guidance_promotions.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(workflows): 清除活动清单中的退役执行入口'
          git push origin HEAD:refs/heads/fix/doctor-execution-policy
          git rev-parse HEAD > "$RUNNER_TEMP/doctor-repair/commit.txt"
          git archive HEAD -o "$RUNNER_TEMP/doctor-repair/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: doctor-repair-evidence
          path: ${{ runner.temp }}/doctor-repair/*
          if-no-files-found: warn
          retention-days: 7
