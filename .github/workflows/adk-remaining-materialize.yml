name: ADK Remaining Skills Materialize
on:
  push:
    branches: ['import/adk-remaining-skills-7.0.31']
    paths: ['.github/workflows/adk-remaining-materialize.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: jiying2007/agent-dev-kit
          ref: 7367ef84787de75bb751940b32c9e80009660e47
          path: .adk-upgrade-source
          persist-credentials: false
      - name: Import the reviewed source and metadata projection
        run: |
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
          git merge-base --is-ancestor 2cc82356b1a46db3aa106e308966464614b59e8c HEAD
          git apply --check .github/adk-import.patch
          git apply .github/adk-import.patch
          python .github/adk-import-once.py "$PWD" "$PWD/.adk-upgrade-source"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'tools/codex_assets/adk_skill_audit.py': 'b4a6a0b9f80726f54f9d64bb9aea37403c255d97',
              'manifests/skills.json': '1228eab1aa5ca10234c70b8c458e7e4e4713985b',
              'tests/fixtures/adk-skill-sources-7.0.31.json': '7e6a5a7425c948863735a8eea07d244845a32045',
              'src/codex-home/skills/registry.csv': '9a43d1be323522f3c08f057c517678a660456eb2',
              'AGENTS.md': 'fd6cd1e9e51f13d2dc098639d7998729fe40d413',
          }
          for path, expected_blob in expected.items():
              data = Path(path).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == expected_blob, path
          PY
      - name: Verify the complete imported sources and installation regressions
        env:
          CODEX_OFFLINE_HERMETIC: '1'
        run: |
          python -m unittest tests.test_adk_skill_distribution tests.test_adk_daily_core_import tests.test_adk_skill_audit tests.test_agent_rules tests.test_doctor_execution_policy tests.test_agent_routing_eval tests.test_profile_documentation
          python -m tools.codex_assets.check_skills
          python scripts/validate-agent-rules.py
          python -m tools.codex_assets doctor --scope repo
          git diff --check
      - name: Commit only tested resource and validator files
        run: |
          test "$(git ls-remote origin refs/heads/import/adk-remaining-skills-7.0.31 | cut -f1)" = "$GITHUB_SHA"
          git add -- AGENTS.md src/codex-home/AGENTS.md src/codex-home/vendor/skills/adk-* src/codex-home/skills/registry.csv manifests/skills.json tools/codex_assets/adk_skill_audit.py tests/test_adk_daily_core_import.py tests/test_adk_skill_distribution.py tests/fixtures/adk-skill-sources-7.0.31.json docs/adk-source-upgrade.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(skills): 完成42项ADK来源与原生分发元数据绑定'
          git push origin HEAD:refs/heads/import/adk-remaining-skills-7.0.31
      - name: Retain exact candidate for final independent readback
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/adk-import"
          git rev-parse HEAD > "$RUNNER_TEMP/adk-import/commit.txt"
          git diff --stat > "$RUNNER_TEMP/adk-import/remaining-diff.txt"
          git archive HEAD > "$RUNNER_TEMP/adk-import/candidate.tar"
          python -m tools.codex_assets.adk_skill_audit --summary-json > "$RUNNER_TEMP/adk-import/audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adk-remaining-import
          path: ${{ runner.temp }}/adk-import/
          retention-days: 7
