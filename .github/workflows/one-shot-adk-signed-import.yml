name: One-shot signed ADK 11.4.16 source import
on:
  push:
    branches:
      - automation/adk-11.4.16-signed-source-import
permissions:
  contents: write
  actions: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python 3.12 for import tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install source SDK requirements
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-codex-assets.txt
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - name: Verify exact signed source, import on candidate branch
        shell: bash
        run: bash scripts/one-shot-adk-11.4.16-signed-import.sh
