name: ADK 11.2.1 Signed Source Audit (One-off)
on:
  push:
    branches:
      - audit/adk-11.2.1-source-20261110
permissions:
  contents: write
  actions: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Codex source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Capture exact ADK source
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v11.2.1 https://github.com/jiying2007/agent-dev-kit.git "$RUNNER_TEMP/adk"
          test "$(git -C "$RUNNER_TEMP/adk" rev-parse HEAD)" = a5ba89065b163594571cc673dd436a23524725a6
          test "$(git -C "$RUNNER_TEMP/adk" rev-parse HEAD^{tree})" = 9e679843c2f4b6d87a8ed8542029ca58abbbd437
          test "$(git -C "$RUNNER_TEMP/adk" hash-object manifest.json)" = 8f11102cacb75663ea5861bff0edee094a078cab
          test -z "$(git -C "$RUNNER_TEMP/adk" status --porcelain)"
          python -m pip install --disable-pip-version-check --no-input -r requirements-codex-assets.txt
          mkdir -p "$RUNNER_TEMP/adk-audit"
          python -m tools.codex_assets.adk_skill_audit \
            --provider-root "$RUNNER_TEMP/adk" \
            --expected-provider-commit a5ba89065b163594571cc673dd436a23524725a6 \
            --summary-json | tee "$RUNNER_TEMP/adk-audit/source-audit.json"
      - name: Verify upstream signed promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42651528457 --repo jiying2007/agent-dev-kit \
            --name adk-promotion-evidence-a5ba89065b163594571cc673dd436a23524725a6 \
            --dir "$RUNNER_TEMP/adk-audit"
          echo "d1ba69e191cb37d596b94b94117a8971e0c4f7e800f382dac35af50fcaa8a1c7  $RUNNER_TEMP/adk-audit/promotion-evidence.json" | sha256sum --check --strict
          echo "08ee232011ee3537e398788f04af78e194e36565b947dc5713e3d8cf3e0c4c67  $RUNNER_TEMP/adk-audit/promotion-attestation.json" | sha256sum --check --strict
          test "$(gh api repos/jiying2007/agent-dev-kit/releases/tags/v11.2.1 --jq .immutable)" = true
          cosign verify-blob --use-signed-timestamps \
            --bundle "$RUNNER_TEMP/adk-audit/promotion-attestation.json" \
            --certificate-identity https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/adk-audit/promotion-evidence.json"
      - name: Inspect pinned Sigstore trusted root
        run: |
          set -euo pipefail
          f="$HOME/.sigstore/root/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          if [[ -f "$f" ]]; then
            sha256sum "$f"
            echo "expected-import-root: 6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66"
          else
            echo "expected root path not materialized by cosign; explicit importer root unavailable"
          fi
      - name: Construct exact-source Codex candidate (isolated only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export ADK_ROOT="$RUNNER_TEMP/adk"
          export ADK_EVIDENCE="$RUNNER_TEMP/adk-audit"
          export ADK_SOURCE_SHA=a5ba89065b163594571cc673dd436a23524725a6
          export ADK_VERSION=11.2.1
          export ADK_ARCHIVE_SHA256=dfd7dbea35d52fa60aa45fc4e1ce8c3d689d7209dc2482fe4edfe13e998bad90
          export ADK_TRUSTED_ROOT="$HOME/.sigstore/root/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          echo "6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66  $ADK_TRUSTED_ROOT" | sha256sum --check --strict
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path.cwd()
          skills=json.loads((root/'manifests/skills.json').read_text())['skills']
          agents=json.loads((root/'manifests/agents.json').read_text())['agents']
          previous={
              'skills':{r['name']:r for r in skills if r.get('enabled') and r.get('owner')=='agent-dev-kit'},
              'agents':{r['name']:r for r in agents if r.get('source_repo')=='jiying2007/agent-dev-kit'},
          }
          assert len(previous['skills'])==41, 'unexpected ADK Skills inventory'
          (Path(os.environ['ADK_EVIDENCE'])/'previous.json').write_text(json.dumps(previous,ensure_ascii=False,indent=2)+'\n')
          PY
          python -m tools.codex_assets.adk_source_import \
            --provider-root "$ADK_ROOT" --expected-provider-commit "$ADK_SOURCE_SHA" \
            --promotion-evidence "$ADK_EVIDENCE/promotion-evidence.json" \
            --promotion-attestation "$ADK_EVIDENCE/promotion-attestation.json" \
            --trusted-root "$ADK_TRUSTED_ROOT" --release-artifact-sha256 "$ADK_ARCHIVE_SHA256" \
            --summary-json | tee "$ADK_EVIDENCE/import-plan.json"
          python -m tools.codex_assets.adk_source_import \
            --provider-root "$ADK_ROOT" --expected-provider-commit "$ADK_SOURCE_SHA" \
            --promotion-evidence "$ADK_EVIDENCE/promotion-evidence.json" \
            --promotion-attestation "$ADK_EVIDENCE/promotion-attestation.json" \
            --trusted-root "$ADK_TRUSTED_ROOT" --release-artifact-sha256 "$ADK_ARCHIVE_SHA256" \
            --apply --summary-json | tee "$ADK_EVIDENCE/import-apply.json"
          # Explicitly preserve the independent Python 3.8-compatible Codex runtime policy.
          # Its unchanged 8.2.0 source must never be mislabeled as 11.2.1 policy code.
          git restore --source=HEAD -- manifests/execution_policy.json tools/codex_assets/execution_policy
          python - <<'PY'
          import json,os,pathlib,subprocess,yaml
          from tools.codex_assets.adk_skill_audit import _tree,_candidate,_provider
          root=pathlib.Path.cwd()
          provider_root=pathlib.Path(os.environ['ADK_ROOT'])
          source_sha=os.environ['ADK_SOURCE_SHA']
          old=json.loads((pathlib.Path(os.environ['ADK_EVIDENCE'])/'previous.json').read_text())
          manifest=json.loads((root/'manifests/skills.json').read_text())
          current={x['name']:x for x in manifest['skills'] if x.get('enabled') and x.get('owner')=='agent-dev-kit'}
          assert len(current)==41 and set(current)==set(old['skills'])
          golden=json.loads((root/'tests/fixtures/adk-skill-sources-8.2.0.json').read_text())
          state=_provider(provider_root,source_sha)
          new={'license_blob':golden['license_blob'],'provider_commit':source_sha,
               'provider_repository':'jiying2007/agent-dev-kit','release':'v11.2.1','skills':{}}
          for name,item in sorted(current.items()):
              former=old['skills'][name]
              assert item['source_ref']==source_sha and item['version'] != former['version'],name
              rootrel=pathlib.PurePosixPath(item['source_path']).parent
              upstream=_candidate(provider_root,item['source_path'],state)
              installed=_tree(root/'src/codex-home'/item['vendor_rel'])
              previous_gold=golden['skills'][name]
              native_path=provider_root/rootrel/'agents/openai.yaml'
              native=yaml.safe_load(native_path.read_text()) if native_path.is_file() else None
              new['skills'][name]={
                  'installed_license_blob':installed['LICENSE']['blob'],
                  'openai_source':native,
                  'profiles':item['profiles'],
                  'source_path':item['source_path'],
                  'target_rel':item['target_rel'],
                  'tree':upstream,
                  'version':item['version'],
              }
              assert previous_gold['profiles']==item['profiles'] and previous_gold['source_path']==item['source_path']
          out=root/'tests/fixtures/adk-skill-sources-11.2.1.json'
          assert not out.exists()
          out.write_text(json.dumps(new,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          # Remove superseded vendored versions only in this disposable clean candidate,
          # never from user machines or existing Git history.
          for name,former in old['skills'].items():
              previous_dir=root/'src/codex-home'/former['vendor_rel']
              assert previous_dir.is_dir(),previous_dir
              subprocess.run(['git','rm','-r','--quiet','--',str(previous_dir.relative_to(root))],check=True)
          updated_agents=json.loads((root/'manifests/agents.json').read_text())['agents']
          for a in updated_agents:
              if a['name'] in old['agents']:
                  former=old['agents'][a['name']]
                  assert a['source_ref']==source_sha and a['vendor_rel']!=former['vendor_rel']
                  prev=root/'src/codex-home'/former['vendor_rel']
                  # old AGENTS.md and parent are removed only after exact new identity is written
                  assert prev.is_file() and (root/'src/codex-home'/a['vendor_rel']).is_file()
                  subprocess.run(['git','rm','--quiet','--',str(prev.relative_to(root))],check=True)
          # Promote immutable golden fixture without rewriting the historical 8.2.0 fixture.
          test=root/'tests/test_adk_skill_distribution.py'
          txt=test.read_text()
          txt=txt.replace('22e6c790d1ed191cecc3083dc001a6ccfed264f6',source_sha)
          txt=txt.replace('adk-skill-sources-8.2.0.json','adk-skill-sources-11.2.1.json')
          txt=txt.replace('self.assertEqual("v8.2.0", record["source_release"])','self.assertEqual("v11.2.1", record["source_release"])')
          txt=txt.replace('self.assertEqual("8.2.0", report["provider_lock_version"])','self.assertEqual("11.2.1", report["provider_lock_version"])')
          start=txt.index('        # Keep the original 43-source golden immutable:')
          finish=txt.index('        for name, record in self.records.items():',start)
          txt=txt[:start]+'        self.assertEqual(41, len(self.golden["skills"]))\n        self.assertEqual(set(self.records), set(self.golden["skills"]))\n'+txt[finish:]
          assert 'adk-skill-sources-11.2.1.json' in txt and 'v8.2.0' not in txt
          test.write_text(txt)
          ep=root/'tests/test_execution_policy_source_set.py'
          policy=ep.read_text()
          policy=policy.replace('def test_vendored_execution_policy_matches_adk_820(self)', 'def test_vendored_execution_policy_remains_explicitly_pinned_820(self)')
          policy=policy.replace('self.assertEqual("8.2.0", provider["version"])','self.assertEqual("11.2.1", provider["version"])')
          policy=policy.replace('self.assertEqual("22e6c790d1ed191cecc3083dc001a6ccfed264f6", provider["provider_commit"])',
              'self.assertEqual("a5ba89065b163594571cc673dd436a23524725a6", provider["provider_commit"])\n'
              '        behavior=json.loads((ROOT/"manifests/execution_policy.json").read_text())["engine"]["behavior_baseline"]\n'
              '        self.assertEqual("8.2.0", behavior["version"])\n'
              '        self.assertEqual("22e6c790d1ed191cecc3083dc001a6ccfed264f6", behavior["commit"])')
          ep.write_text(policy)
          PY
          mkdir -p docs/changes/20261110-adk-1121-skills-source
          printf '%s\n' '# ADK 11.2.1 Skills-only consumer import' ''              '- Canonical source: jiying2007/agent-dev-kit v11.2.1, a5ba89065b163594571cc673dd436a23524725a6.'              '- Signed source: ADK Actions run 42651528457, source artifact 13690606665; exact Sigstore trust root verified.'              '- 41 source Skills copied with complete references, new immutable version directories and current manifests/registry; old active vendor version directories retired in the isolated candidate.'              '- Nine Agent blobs have equal upstream content and are rebound to the new source without model/runtime certification.'              '- Execution Policy remains separately pinned to ADK v8.2.0 as an explicit Python 3.8-compatible runtime boundary; new ADK Python 3.12 policy modules are NOT installed into Codex.'              '- This is source/distribution only, not a write to ~/.codex, native trigger evidence, or product release readiness.'              '- Rollback: review and revert this consumer PR to the previous immutable exact source set; no old upstream tag is moved.'              > docs/changes/20261110-adk-1121-skills-source/README.md
          python -m unittest tests.test_adk_skill_audit tests.test_adk_skill_distribution tests.test_execution_policy_source_set tests.test_profile_documentation -q
          python -m tools.codex_assets.adk_skill_audit --summary-json | tee "$ADK_EVIDENCE/post-import-audit.json"
          git diff --check
      - name: Push exact reviewed candidate branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/audit/adk-11.2.1-source-20261110"
          test -z "$(git status --porcelain --untracked-files=normal | grep '^??' | grep -v 'tests/fixtures/adk-skill-sources-11.2.1.json' | grep -v 'docs/changes/20261110-adk-1121-skills-source/' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests src/codex-home tests docs/changes/20261110-adk-1121-skills-source tools/codex_assets/execution_policy
          git diff --cached --check
          git diff --cached --quiet && { echo "expected a non-empty candidate diff"; exit 1; }
          git commit -m "chore(skills): 按签名来源晋级 ADK 11.2.1 公共技能"
          gh auth setup-git
          git push origin "HEAD:refs/heads/audit/adk-11.2.1-source-20261110"
      - name: Upload source-only audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adk-11.2.1-consumer-source-audit
          path: ${{ runner.temp }}/adk-audit/source-audit.json
          if-no-files-found: warn
          retention-days: 14
