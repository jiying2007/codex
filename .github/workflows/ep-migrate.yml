name: ADK Agent Policy Migration
on:
  push:
    branches: [import/adk-agent-policy-7.0.31]
    paths: ['.github/ep-migrate.py', '.github/workflows/ep-migrate.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: import/adk-agent-policy-7.0.31
          fetch-depth: 2
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: jiying2007/agent-dev-kit
          ref: 7367ef84787de75bb751940b32c9e80009660e47
          path: .adk-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply exact reviewed migration
        run: |
          test "$(git rev-parse HEAD^)" = 6318ad8ddd4d5f268c8ca68980119e998f250e43
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python .github/ep-migrate.py
          git diff --check
          python scripts/validate-runtime-binding.py
          python scripts/validate-adk-agent-binding.py
          python -m tools.codex_assets doctor --scope repo
          python -m tools.codex_assets doctor --scope governance
          CODEX_OFFLINE_HERMETIC=1 python -m unittest tests.test_execution_policy_migration tests.test_execution_policy_source_set tests.test_execution_policy tests.test_doctor_execution_policy.DoctorPolicyContractTests tests.test_governance tests.test_governance_summary tests.test_session_bootstrap tests.test_session_bootstrap_independence tests.test_adk_skill_distribution
      - name: Commit only the migration paths
        run: |
          git add README.md docs/adk-source-upgrade.md docs/execution-policy.md manifests/agents.json manifests/execution_policy.json manifests/integrations/digital-worker-runtime-binding.json manifests/provider-locks/agent-dev-kit.json scripts/validate-adk-agent-binding.py scripts/validate-runtime-binding.py src/codex-home/vendor/agents/agent-dev-kit tools/codex_assets/execution_policy tools/codex_assets/execution_policy_adapter.py tests/fixtures/execution-policy-migration-replay.json tests/test_adk_skill_distribution.py tests/test_doctor_execution_policy.py tests/test_governance.py tests/test_execution_policy_source_set.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(runtime): 迁移ADK Agent与执行策略到同一固定来源'
          git push origin HEAD:refs/heads/import/adk-agent-policy-7.0.31
          mkdir -p "$RUNNER_TEMP/migration"
          git rev-parse HEAD > "$RUNNER_TEMP/migration/commit.txt"
          git archive HEAD > "$RUNNER_TEMP/migration/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adk-agent-policy-migration
          path: ${{ runner.temp }}/migration/
          retention-days: 7
