########################################
# Codex Industrial Config (VSCode)
# https://developers.openai.com/codex/config-basic
# https://developers.openai.com/codex/config-advanced
# https://developers.openai.com/codex/config-reference
# https://developers.openai.com/codex/config-sample
# 日常使用单一默认配置；通过受管构建与同步链路更新。
########################################

developer_instructions = "请使用中文回答,务必使用清晰详细准确的风格。"

# ========================
# 模型配置
# ========================
model = "gpt-5.6-terra"  # 默认快速模型（适合日常编码与资产管理任务）

# 推理强度（核心成本控制参数）
# low    = 最省钱（推荐日常）
# medium = 平衡
# high   = 深度分析
model_reasoning_effort = "medium"
# 显式进入计划模式时固定较深推理；不影响日常默认强度。
plan_mode_reasoning_effort = "high"

# 推理摘要和输出冗余控制
model_reasoning_summary = "concise"
model_verbosity = "medium"

# 输出风格（影响长度 & 是否乱改代码）
# none      = 无特别风格，默认最简洁的风格
# friendly  = 更友好的输出风格，适用于与用户交互
# pragmatic = 更务实、直白的风格，适用于任务执行
personality = "pragmatic"


# ========================
# Token / 上下文控制（核心优化区）
# ========================

# 上下文窗口与自动压缩阈值由模型目录和 CLI 自动识别，不手动覆盖。
# 工具输出限制：覆盖编译、链接和现场日志的定向验证。
tool_output_token_limit = 20000


# ========================
# 官方权限与运行边界
# ========================

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
hide_agent_reasoning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []
file_opener = "vscode"

[sandbox_workspace_write]
network_access = false
writable_roots = [
  "/home/leiwenjun/.codex/memories",
]


# ========================
# Shell 环境控制
# ========================
[shell_environment_policy]

# 环境变量继承策略：
# all  = 全部（污染上下文）
# core = 精简（推荐）
# none = 最干净（可能找不到工具）
inherit = "core"

# ========================
# 高级功能（Agent 控制）
# ========================
[features]

# 保留代理入口；实际派发仍遵循用户授权和项目规则。
multi_agent = true
memories = true

[agents]
# 同时最多 3 个子代理，不含主代理。
max_concurrent_threads_per_session = 3

[memories]
# 使用既有记忆；新线程不成为自动记忆生成输入。
use_memories = true
generate_memories = false


# ========================
# 历史记录
# ========================

[history]
persistence = "save-all"
max_bytes = 52428800


# ========================
# TUI 状态栏
# ========================

# Codex CLI 内置状态栏片段。保持低噪音，优先显示分支、上下文和成本相关信息。
# 不默认显示 current-dir，深层工作目录会挤占分支和限额信息；完整项目上下文保留在 terminal_title。
[tui]
notifications = ["approval-requested", "agent-turn-complete"]
notification_condition = "unfocused"
notification_method = "auto"
animations = false
show_tooltips = false
alternate_screen = "auto"
# 默认使用便于终端选择、复制日志的滚动输出；/raw 或 Alt+R 可切换。
raw_output_mode = true
# resume_cwd 保持未设置，恢复目录不一致时由 CLI 询问。
status_line = [
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
  "model-with-reasoning",
]
terminal_title = ["spinner", "project", "git-branch", "status"]


# 日常只维护默认配置；临时参数通过 codex -c key=value 覆盖。

# ========================
# 项目信任配置（按需添加本机路径）
# ========================
# 示例：
# [projects."/home/yourname/work/myproject"]
# trust_level = "trusted"



