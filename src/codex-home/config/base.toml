########################################
# Codex Industrial Config (VSCode)
# https://developers.openai.com/codex/config-basic
# https://developers.openai.com/codex/config-advanced
# https://developers.openai.com/codex/config-reference
# https://developers.openai.com/codex/config-sample
# Ctrl + Shift + P -> Run Task -> Codex: Mode
# Ctrl + Shift + P -> Reload Window
########################################

developer_instructions = "请使用中文回答,务必使用清晰详细准确的风格。"

# ========================
# 模型配置
# ========================
model = "gpt-5.5"  # 默认前沿模型（适合复杂代码与资产管理任务）

# 推理强度（核心成本控制参数）
# low    = 最省钱（推荐日常）
# medium = 平衡
# high   = 深度分析
model_reasoning_effort = "high"

# 推理摘要和输出冗余控制
model_reasoning_summary = "concise"
model_verbosity = "medium"

# 输出风格（影响长度 & 是否乱改代码）
# none      = 无特别风格，默认最简洁的风格
# friendly  = 更友好的输出风格，适用于与用户交互
# pragmatic = 更务实、直白的风格，适用于任务执行
personality = "pragmatic"


# ========================
# Token / 上下文控制（核心优化区）
# ========================

# 最大上下文窗口（注意：不是越大越好）
# 太大会导致扫描无关文件 -> token 暴涨
model_context_window = 160000

# 自动压缩阈值（超过就裁剪历史）
# 防止对话越来越长
model_auto_compact_token_limit = 100000

# 工具输出限制
tool_output_token_limit = 16000


# ========================
# 执行行为控制（防止 token 爆炸）
# ========================

# 是否自动执行命令（强烈建议关闭）
# true  = 自动跑命令（危险 + 烧 token）
# false = 手动确认（推荐）
auto_execute = false


# ========================
# 官方权限与运行边界
# ========================

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
hide_agent_reasoning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []
file_opener = "vscode"

[sandbox_workspace_write]
network_access = false
writable_roots = [
  "/home/leiwenjun/.codex/memories",
]


# ========================
# Shell 环境控制
# ========================
[shell_environment_policy]

# 环境变量继承策略：
# all  = 全部（污染上下文）
# core = 精简（推荐）
# none = 最干净（可能找不到工具）
inherit = "core"

# Linux 下使用 bash，避免依赖 PowerShell
[shell]
program = "rtk"
args = ["bash", "-lc"]


# ========================
# 工作区权限控制
# ========================
[workspace]

# 允许写文件（必须开）
write = true

# 是否允许执行命令
# - npm install
# - test
# - build
run_commands = true


# ========================
# 高级功能（Agent 控制）
# ========================
[features]

# 多 Agent 模式（耗 token）
# true  = 多代理协作
# false = 单代理（推荐）
multi_agent = true


# ========================
# 历史记录
# ========================

[history]
persistence = "save-all"
max_bytes = 52428800


# ========================
# TUI 状态栏
# ========================

# Codex CLI 内置状态栏片段。保持低噪音，优先显示排障和成本相关信息。
[tui]
notifications = false
animations = false
show_tooltips = false
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
]
terminal_title = ["spinner", "project", "git-branch"]


# ========================
# 官方 Profile 模式
# ========================

# 长期推荐入口：
#   codex --profile dev
#   codex --profile debug
#   codex --profile embedded
#   codex --profile max
# 这些 profile 只影响启动后的新会话；运行中的会话不热切换。

[profiles.dev]
model_reasoning_effort = "low"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "none"
model_context_window = 60000
model_auto_compact_token_limit = 40000
tool_output_token_limit = 10000
auto_execute = false
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
hide_agent_reasoning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[profiles.dev.shell_environment_policy]
inherit = "none"

[profiles.dev.workspace]
write = true
run_commands = false

[profiles.dev.features]
multi_agent = false

[profiles.dev.history]
persistence = "save-all"
max_bytes = 31457280


[profiles.debug]
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "medium"
personality = "friendly"
model_context_window = 100000
model_auto_compact_token_limit = 70000
tool_output_token_limit = 20000
auto_execute = false
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
hide_agent_reasoning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[profiles.debug.shell_environment_policy]
inherit = "core"

[profiles.debug.workspace]
write = true
run_commands = false

[profiles.debug.features]
multi_agent = false

[profiles.debug.history]
persistence = "save-all"
max_bytes = 52428800


[profiles.embedded]
model_reasoning_effort = "low"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "none"
model_context_window = 80000
model_auto_compact_token_limit = 50000
tool_output_token_limit = 12000
auto_execute = false
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
hide_agent_reasoning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[profiles.embedded.shell_environment_policy]
inherit = "core"

[profiles.embedded.workspace]
write = true
run_commands = false

[profiles.embedded.features]
multi_agent = false

[profiles.embedded.history]
persistence = "save-all"
max_bytes = 31457280


[profiles.max]
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "medium"
personality = "pragmatic"
model_context_window = 1000000
model_auto_compact_token_limit = 700000
tool_output_token_limit = 30000
auto_execute = false
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
hide_agent_reasoning = true
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[profiles.max.shell_environment_policy]
inherit = "core"

[profiles.max.workspace]
write = true
run_commands = true

[profiles.max.features]
multi_agent = true

[profiles.max.history]
persistence = "save-all"
max_bytes = 104857600


# ========================
# 项目信任配置（按需添加本机路径）
# ========================
# 示例：
# [projects."/home/yourname/work/myproject"]
# trust_level = "trusted"



# >>> CODEX-MANAGED MCP START
# profile = team-collab
# generated_at = 2026-05-09 19:34:26 +0800

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = false
required = false
supports_parallel_tool_calls = true

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = ""

[mcp_servers.docs]
command = "npx"
args = ["-y", "@openai/docs-mcp"]
enabled = false
required = false
supports_parallel_tool_calls = true

[mcp_servers.docs.env]
OPENAI_API_KEY = ""

[mcp_servers.figma]
command = "npx"
args = ["-y", "figma-developer-mcp"]
enabled = false
required = false
supports_parallel_tool_calls = false

[mcp_servers.figma.env]
FIGMA_ACCESS_TOKEN = ""

