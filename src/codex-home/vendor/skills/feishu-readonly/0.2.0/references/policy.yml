name: codex-feishu-readonly
description: Read-only Feishu document access with bot identity.
allow:
  - wiki/+node-get
  - docs/+fetch
  - sheets/+workbook-info
  - sheets/+csv-get
  - sheets/+cells-get
  - drive/+download
  - drive/+preview
max_risk: read
identities:
  - bot
allow_unannotated: false
